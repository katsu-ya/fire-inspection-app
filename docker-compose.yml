services:
  # MySQLデータベース
  db:
    image: mysql:8.0
    # 日本語文字化け防止: utf8mb4 を強制。タイムゾーンはJSTに固定（CURDATE等の日付ズレ防止）
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+09:00
    env_file: .env
    environment:
      - TZ=Asia/Tokyo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  # Spring Bootバックエンド
  backend:
    build: ./backend
    env_file: .env
    environment:
      # JVM・OSのタイムゾーンをJSTに固定（JDBCの日付変換ズレ防止）
      - TZ=Asia/Tokyo
    ports:
      - "8080:8080"
    volumes:
      # ソースをマウント（変更後は docker compose restart backend で反映）
      - ./backend/src:/app/src
      # Mavenローカルリポジトリをキャッシュして再起動を高速化
      - maven_cache:/root/.m2
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  # Next.jsフロントエンド
  frontend:
    build: ./frontend
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    environment:
      # Dockerコンテナ内でのファイル変更検知にポーリングを使用
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - app_network

# 名前付きボリューム（DBデータ・Mavenキャッシュの永続化）
volumes:
  mysql_data:
  maven_cache:

# サービス間通信用ブリッジネットワーク
networks:
  app_network:
    driver: bridge
